:root{
  --bg:#f6f3ec; --card:#ffffff; --ink:#1c2620; --ink2:#46524a; --muted:#7d877f; --line:#e4dfd3;
  --forest:#2c5a43; --forest-d:#1d3f2e; --clay:#a4573a; --sand:#efe9dc;
  --sans:"Inter","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI Variable","Segoe UI","Helvetica Neue",sans-serif;
  --serif:"Source Serif 4","Iowan Old Style","Georgia",serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#141a16;overflow:hidden;font-family:var(--sans);color:var(--ink);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
svg text{font-family:var(--sans)}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center;
  transform:translate(-50%,-50%);overflow:hidden;
  background:radial-gradient(1100px 600px at 12% -10%,#fffdf8 0%,transparent 60%),var(--bg)}
#stage::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;
  background:linear-gradient(180deg,#d7261e,#ef6a1a,#e3c52a,#2fa655,#2d86c9,#7a3fb5)}
#slides{position:absolute;inset:0}
.slide{position:absolute;inset:0;padding:30px 56px 0 64px;opacity:0;visibility:hidden;
  transition:opacity .4s ease, visibility .4s}
.slide.on{opacity:1;visibility:visible}
.kicker{font-size:12.5px;font-weight:600;letter-spacing:2.6px;text-transform:uppercase;color:var(--clay);height:18px}
.kicker i{font-style:normal;color:var(--muted);margin:0 8px}
.slide h1{margin:6px 0 0;height:62px;font-family:var(--serif);font-size:48px;line-height:62px;font-weight:600;
  color:var(--forest-d);letter-spacing:-.8px;white-space:nowrap}
.cols{display:flex;gap:44px;height:516px;margin-top:18px}
.left{width:408px;flex:none;display:flex;flex-direction:column}
.left ul{list-style:none;margin:6px 0 0;padding:0}
.left li{position:relative;padding:0 0 0 26px;margin-bottom:19px;font-size:19.5px;line-height:1.5;color:var(--ink2);font-weight:400}
.left li::before{content:"";position:absolute;left:0;top:.62em;width:12px;height:2px;border-radius:2px;background:var(--clay)}
.left li b{color:var(--ink);font-weight:650}
.left sup,.left sub{font-size:.68em;line-height:0}
.fact{margin-top:auto;margin-bottom:6px;padding:20px 0 0;border-top:1.5px solid var(--line)}
.fact .big{font-family:var(--serif);font-size:58px;font-weight:600;line-height:1;color:var(--forest);letter-spacing:-1.5px}
.fact .big sup{font-size:.45em;vertical-align:top;position:relative;top:.1em}
.fact .cap{margin-top:10px;font-size:14.5px;line-height:1.45;color:var(--muted);max-width:340px}
.panel{flex:1;background:var(--card);border:1px solid var(--line);border-radius:20px;
  box-shadow:0 1px 2px rgba(40,50,40,.05),0 18px 44px -14px rgba(40,55,40,.22);
  display:flex;flex-direction:column;overflow:hidden;min-width:0}
.panel-head{height:48px;flex:none;display:flex;align-items:center;justify-content:space-between;
  padding:0 14px 0 22px;border-bottom:1px solid var(--line);
  font-weight:600;font-size:11.5px;letter-spacing:2.2px;text-transform:uppercase;color:var(--muted)}
.panel-head span::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--forest);margin-right:10px;vertical-align:1px}
.panel-body{flex:1;padding:12px 20px 12px;position:relative;min-height:0;display:flex;flex-direction:column;gap:9px}
.panel-body svg{display:block;width:100%}
button{font:inherit;cursor:pointer}
.btn{border:1px solid #cfc8b8;background:#fff;color:var(--ink);border-radius:999px;
  padding:7px 16px;font-weight:550;font-size:14px;letter-spacing:.1px;transition:background .15s,border-color .15s,transform .1s,box-shadow .15s}
.btn:hover:not(:disabled){background:#f6f3ec;border-color:var(--forest)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--forest);border-color:var(--forest);color:#fff;box-shadow:0 4px 12px -4px rgba(44,90,67,.55)}
.btn.primary:hover:not(:disabled){background:var(--forest-d);border-color:var(--forest-d)}
.btn.sel{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.reset{padding:5px 14px;font-size:12px;border-color:var(--line);color:var(--ink2);font-weight:600;letter-spacing:.3px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.readout{display:flex;align-items:center;gap:16px}
.chip{display:inline-block;min-width:170px;text-align:center;padding:5px 18px;border-radius:999px;
  color:#fff;font-weight:650;font-size:19px;letter-spacing:.2px;transition:background .25s;text-shadow:0 1px 2px rgba(0,0,0,.28)}
.note{font-size:13.5px;color:var(--muted);line-height:1.4}
.note b{color:var(--ink2);font-weight:600}
.status{min-height:42px;font-size:14.5px;font-weight:550;color:var(--ink);background:#f6f3ec;
  border-left:3px solid var(--forest);border-radius:4px 10px 10px 4px;padding:9px 14px;line-height:1.35}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:12px;border-radius:9px;
  outline:none;border:0;margin:6px 0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;
  background:#fff;border:4px solid var(--forest-d);cursor:grab;box-shadow:0 3px 10px rgba(0,0,0,.3)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;
  background:var(--forest-d);border:4px solid #fff;cursor:grab;box-shadow:0 3px 10px rgba(0,0,0,.28)}
.slider-wrap{position:relative}
.slider-ticks{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);padding:0 4px;font-variant-numeric:tabular-nums}
.bar-rect,.gauge-mark{transition:all .25s ease}
#nav{position:absolute;left:64px;right:56px;bottom:0;height:56px;display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12.5px}
#nav button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink2);
  display:flex;align-items:center;justify-content:center;padding:0;transition:background .15s,border-color .15s}
#nav button:hover{background:var(--sand);border-color:var(--forest)}
#nav svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#counter{font-weight:600;font-size:14px;min-width:54px;text-align:center;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.5px}
#progress{flex:1;height:3px;border-radius:3px;background:var(--line);margin:0 18px;position:relative;overflow:hidden}
#progress i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--forest),#4f8f6a);border-radius:3px;transition:width .4s ease}
#hint{letter-spacing:.3px}
.byline{position:absolute;right:56px;top:46px;font-size:15px;color:var(--ink2);letter-spacing:.2px;padding:8px 0 8px 18px;border-left:2px solid var(--clay);line-height:1.2}
.byline b{font-weight:650;color:var(--ink)}
</style>
</head>
<body>
<div id="stage">
  <div id="slides"></div>
  <div id="nav">
    <button id="prev" aria-label="Previous slide" title="Previous (←)"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span id="counter">1 / 5</span>
    <button id="next" aria-label="Next slide" title="Next (→)"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <div id="progress"><i></i></div>
    <span id="hint">← → navigate &nbsp;·&nbsp; F fullscreen</span>
    <button id="fs" aria-label="Fullscreen" title="Fullscreen (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
</div>
<script>
/* Slide 1 — What is Soil pH? */
(window.SLIDES = window.SLIDES || [])[0] = {
  title: 'What is Soil pH?',
  byline: 'by <b>Gustavo Saldanha</b> and <b>Arthur Fabbri</b>',
  bullets: [
    '<b>pH</b> measures hydrogen ion (H<sup>+</sup>) activity in the soil water',
    'Scale <b>0–14</b>: &lt;7 acidic, 7 neutral, &gt;7 alkaline',
    'Each unit = <b>10× more H<sup>+</sup></b> (pH 5 is 10× more acidic than pH 6)',
    'Most plants prefer <b>pH 6–7</b>'
  ],
  fact: ['10×', 'more hydrogen ions for every one-unit drop on the pH scale'],
  build(body) {
    const plat = (p, l0, l1, h1, h2, fl) =>
      p < l0 ? fl : p < l1 ? fl + (1 - fl) * (p - l0) / (l1 - l0) :
      p <= h1 ? 1 : p < h2 ? 1 - (1 - fl) * (p - h1) / (h2 - h1) : fl;
    const NUTS = [
      { k: 'N',  name: 'Nitrogen',   col: '#4f8f3a', f: p => plat(p, 4, 6, 7.5, 9, .3) },
      { k: 'P',  name: 'Phosphorus', col: '#c9822b', f: p => plat(p, 4.5, 6, 7.5, 8.8, .1) },
      { k: 'K',  name: 'Potassium',  col: '#b0689a', f: p => plat(p, 4, 6, 8, 9, .35) },
      { k: 'Ca', name: 'Calcium',    col: '#3f8fb5', f: p => plat(p, 4, 6, 8, 9.5, .25) },
      { k: 'Mg', name: 'Magnesium',  col: '#2f9a86', f: p => plat(p, 4, 6, 7.8, 9.5, .3) },
      { k: 'Fe', name: 'Iron',       col: '#a8532b', f: p => 1 / (1 + Math.exp((p - 6.2) * 1.5)) },
      { k: 'Zn', name: 'Zinc',       col: '#7c7fa8', f: p => 1 / (1 + Math.exp((p - 6.6) * 1.4)) },
      { k: 'Al', name: 'Aluminium',  col: '#d7261e', f: p => clamp((5.5 - p) / 1.5, 0, 1), toxic: true }
    ];

    const readout = el('div', 'readout', body);
    const chip = el('span', 'chip', readout);
    const desc = el('span', 'note', readout);
    const slider = makeSlider(body, 4, 9, 0.1, 6.5, upd);

    const W = 680, H = 330, base = 262, maxH = 205;
    const svg = sv('svg', { viewBox: `0 0 ${W} ${H}` }, body);
    // ideal window (pH 6–7.5 note)
    sv('rect', { x: 8, y: 6, width: W - 16, height: base - 2, rx: 10, fill: '#f1e9d6' }, svg);
    for (let t = 0; t <= 4; t++) {
      const y = base - t * maxH / 4;
      sv('line', { x1: 8, x2: W - 8, y1: y, y2: y, stroke: '#d8ccb6', 'stroke-width': 1 }, svg);
      sv('text', { x: 14, y: y - 3, 'font-size': 11, fill: '#8a7a66' }, svg, t * 25 + '%');
    }
    const cw = (W - 70) / NUTS.length, bars = [];
    NUTS.forEach((n, i) => {
      const cx = 62 + i * cw + cw / 2;
      const bw = cw * 0.62;
      const rect = sv('rect', { class: 'bar-rect', x: cx - bw / 2, y: base, width: bw, height: 0, rx: 5, fill: n.col }, svg);
      const val = sv('text', { x: cx, y: base - 6, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': 700, fill: '#2f261c' }, svg, '');
      sv('text', { x: cx, y: base + 24, 'text-anchor': 'middle', 'font-size': 20, 'font-weight': 700, fill: n.col }, svg, n.k);
      sv('text', { x: cx, y: base + 42, 'text-anchor': 'middle', 'font-size': 11, fill: '#7a6a58' }, svg, n.name);
      let tox = null;
      if (n.toxic) {
        tox = sv('g', { style: 'display:none' }, svg);
        sv('rect', { x: cx - 36, y: 10, width: 72, height: 24, rx: 12, fill: '#d7261e' }, tox);
        sv('text', { x: cx, y: 27, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': 700, fill: '#fff' }, tox, 'TOXIC');
      }
      bars.push({ n, rect, val, tox, bw, cx });
    });
    sv('text', { x: W / 2, y: H - 6, 'text-anchor': 'middle', 'font-size': 13, fill: '#7a6a58' }, svg,
      'Nutrient availability (%) · Al = aluminium solubility (toxic below pH 5.5)');

    function upd(p) {
      p = parseFloat(p);
      const c = phColor(p);
      chip.style.background = c;
      chip.textContent = 'pH ' + p.toFixed(1) + ' · ' + phLabel(p);
      desc.textContent = p >= 6 && p <= 7.5 ? 'Sweet spot: most nutrients available'
        : p < 5.5 ? 'Too acidic: aluminium dissolves, Ca/Mg/P scarce'
        : p < 6 ? 'Slightly low: some nutrients limited'
        : 'Too alkaline: Fe, Zn, P locked up';
      bars.forEach(b => {
        const v = b.n.f(p), h = Math.max(v * maxH, 0);
        b.rect.setAttribute('y', base - h);
        b.rect.setAttribute('height', h);
        b.val.setAttribute('y', base - h - 6);
        b.val.textContent = Math.round(v * 100) + '%';
        if (b.tox) {
          const t = v > 0;
          b.tox.style.display = t ? '' : 'none';
          b.rect.setAttribute('fill', t ? '#d7261e' : '#e7b8b4');
          b.val.textContent = t ? Math.round(v * 100) + '%' : 'safe';
        }
      });
    }
    upd(6.5);
    return { reset() { slider.value = 6.5; upd(6.5); } };
  }
};
</script>
<script>
/* Slide 2 — Measuring Soil pH (step-by-step virtual lab) */
(window.SLIDES = window.SLIDES || [])[1] = {
  title: 'Measuring Soil pH',
  bullets: [
    '<b>pH meter</b> = precise (±0.01–0.1)',
    '<b>pH paper</b> = quick estimate only',
    'Mix soil with distilled water, <b>1 : 2</b> (soil : water)',
    '<b>Calibrate</b> with buffer solutions (pH 7 and 4) before use'
  ],
  fact: ['1 : 2', 'soil to distilled water: the standard ratio for a repeatable reading'],
  build(body) {
    const SAMPLES = { forest: ['Forest soil', 5.2], garden: ['Garden soil', 6.5], chalky: ['Chalky soil', 8.0] };
    const STEPS = ['Turn on', 'Calibrate pH 7', 'Calibrate pH 4', 'Add soil', 'Add water & stir', 'Wait 30 min', 'Measure'];
    const MSG = [
      'Press ① to switch the meter on.',
      'Dip the probe in pH 7 buffer and calibrate.',
      'Now rinse and calibrate with the pH 4 buffer.',
      'Calibrated! Add the soil sample to the beaker.',
      'Add distilled water (1 : 2) and stir.',
      'Let the soil settle — time skip.',
      'Lower the probe into the clear liquid and measure.',
      'Done! Pick another sample or press Reset.'
    ];
    let sample = 'garden', step = 0, timers = [], busy = false, reading = null;
    const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.push(t); return t; };
    const every = (fn, ms) => { const t = setInterval(fn, ms); timers.push(t); return t; };
    const stopAll = () => { timers.forEach(t => { clearTimeout(t); clearInterval(t); }); timers = []; };

    // sample selector
    const sel = el('div', 'row', body);
    el('span', 'note', sel, '<b>Sample:</b>');
    const sbtn = {};
    Object.keys(SAMPLES).forEach(k => {
      const b = el('button', 'btn', sel, SAMPLES[k][0]);
      b.addEventListener('click', () => pick(k));
      sbtn[k] = b;
    });

    const W = 680, H = 300;
    const svg = sv('svg', { viewBox: `0 0 ${W} ${H}` }, body);
    sv('rect', { x: 0, y: 0, width: W, height: H, rx: 10, fill: '#e9f0f2' }, svg);
    sv('rect', { x: 0, y: 262, width: W, height: 38, fill: '#b9a584' }, svg);   // bench
    sv('rect', { x: 0, y: 262, width: W, height: 5, fill: '#9c8864' }, svg);

    // --- meter ---
    const mg = sv('g', {}, svg);
    sv('rect', { x: 36, y: 110, width: 200, height: 152, rx: 14, fill: '#3b4a57', stroke: '#27323b', 'stroke-width': 3 }, mg);
    const lcd = sv('rect', { x: 52, y: 126, width: 168, height: 68, rx: 8, fill: '#16201d' }, mg);
    const lcdTxt = sv('text', { x: 136, y: 174, 'text-anchor': 'middle', 'font-family': 'ui-monospace,SFMono-Regular,Menlo,Consolas,monospace', 'font-size': 40, 'font-weight': 700, fill: '#7dffa8' }, mg, '');
    const lcdSub = sv('text', { x: 136, y: 142, 'text-anchor': 'middle', 'font-family': 'ui-monospace,SFMono-Regular,Menlo,Consolas,monospace', 'font-size': 12, fill: '#7dffa8' }, mg, '');
    const led = sv('circle', { cx: 66, cy: 222, r: 7, fill: '#5a2a2a' }, mg);
    sv('rect', { x: 90, y: 214, width: 50, height: 16, rx: 5, fill: '#56697a' }, mg);
    sv('rect', { x: 150, y: 214, width: 50, height: 16, rx: 5, fill: '#56697a' }, mg);
    sv('text', { x: 136, y: 250, 'text-anchor': 'middle', 'font-size': 12, fill: '#b6c4d0', 'font-weight': 700 }, mg, 'pH METER');

    // --- beaker ---
    const bx = 400, by = 150, bw = 130, bh = 112;
    const clipId = 'bk' + Math.random().toString(36).slice(2, 7);
    const defs = sv('defs', {}, svg);
    const cp = sv('clipPath', { id: clipId }, defs);
    sv('rect', { x: bx + 3, y: by, width: bw - 6, height: bh - 3, rx: 6 }, cp);
    const liquid = sv('g', { 'clip-path': `url(#${clipId})` }, svg);
    const water = sv('rect', { x: bx, y: by + bh, width: bw, height: 0, fill: '#9fd0e8', opacity: .75 }, liquid);
    const soil = sv('rect', { x: bx, y: by + bh, width: bw, height: 0, fill: '#6b4a2c' }, liquid);
    const cloud = sv('rect', { x: bx, y: by + bh - 80, width: bw, height: 80, fill: '#8a6a45', opacity: 0 }, liquid);
    const specks = [];
    for (let i = 0; i < 14; i++)
      specks.push(sv('circle', { cx: bx + 14 + (i * 37) % (bw - 28), cy: by + bh - 50 + (i * 23) % 44, r: 2.4, fill: '#4a3118', opacity: 0 }, liquid));
    sv('path', { d: `M${bx},${by - 6} L${bx + 4},${by + bh - 8} Q${bx + 6},${by + bh} ${bx + 18},${by + bh} L${bx + bw - 18},${by + bh} Q${bx + bw - 6},${by + bh} ${bx + bw - 4},${by + bh - 8} L${bx + bw},${by - 6}`,
      fill: 'rgba(255,255,255,.18)', stroke: '#5a7080', 'stroke-width': 3, 'stroke-linejoin': 'round' }, svg);
    for (let i = 1; i < 4; i++) sv('line', { x1: bx + 6, x2: bx + 22, y1: by + 14 + i * 22, y2: by + 14 + i * 22, stroke: '#5a7080', 'stroke-width': 1.5 }, svg);
    const beakerLbl = sv('text', { x: bx + bw / 2, y: by + bh + 22, 'text-anchor': 'middle', 'font-size': 13, 'font-weight': 700, fill: '#fff' }, svg, '');

    // stir rod
    const rod = sv('g', {}, svg);
    sv('line', { x1: 0, y1: 0, x2: 0, y2: 120, stroke: '#cfd8dc', 'stroke-width': 5, 'stroke-linecap': 'round' }, rod);
    rod.setAttribute('transform', `translate(${bx + bw / 2},${by - 40}) rotate(0)`);
    rod.style.display = 'none';

    // probe + cable
    const probeG = sv('g', {}, svg);
    const probeY = { up: 24, down: 118 };
    const cable = sv('path', { d: '', fill: 'none', stroke: '#2a3238', 'stroke-width': 4, 'stroke-linecap': 'round' }, svg);
    sv('rect', { x: -9, y: 0, width: 18, height: 54, rx: 5, fill: '#c9d2d9', stroke: '#6b7a86', 'stroke-width': 2 }, probeG);
    sv('rect', { x: -6, y: 54, width: 12, height: 54, rx: 6, fill: 'rgba(210,235,245,.9)', stroke: '#6b7a86', 'stroke-width': 2 }, probeG);
    const bulb = sv('ellipse', { cx: 0, cy: 106, rx: 8, ry: 9, fill: '#bfe3f2', stroke: '#6b7a86', 'stroke-width': 2 }, probeG);
    function setProbe(y) {
      probeG.setAttribute('transform', `translate(${bx + bw / 2 + 28},${y})`);
      cable.setAttribute('d', `M236,150 C 280,60 ${bx + bw / 2 + 28},0 ${bx + bw / 2 + 28},${y + 4}`);
    }
    probeG.style.transition = 'none';

    // buffer bottles
    const bot = sv('g', { style: 'display:none' }, svg);
    sv('rect', { x: 580, y: 190, width: 52, height: 72, rx: 8, fill: '#fff', stroke: '#6b7a86', 'stroke-width': 2 }, bot);
    sv('rect', { x: 592, y: 174, width: 28, height: 18, rx: 4, fill: '#6b7a86' }, bot);
    const botFill = sv('rect', { x: 582, y: 212, width: 48, height: 48, rx: 6, fill: '#2fa655' }, bot);
    const botTxt = sv('text', { x: 606, y: 242, 'text-anchor': 'middle', 'font-size': 12, 'font-weight': 700, fill: '#fff' }, bot, '');
    sv('text', { x: 606, y: 204, 'text-anchor': 'middle', 'font-size': 10, fill: '#3b4a57', 'font-weight': 700 }, bot, 'BUFFER');

    // clock for wait
    const clock = sv('g', { transform: 'translate(590,70)', style: 'display:none' }, svg);
    sv('circle', { r: 30, fill: '#fff', stroke: '#5b4129', 'stroke-width': 3 }, clock);
    const hand = sv('line', { x1: 0, y1: 0, x2: 0, y2: -22, stroke: '#5b4129', 'stroke-width': 3, 'stroke-linecap': 'round' }, clock);
    const clockTxt = sv('text', { y: 50, 'text-anchor': 'middle', 'font-size': 13, 'font-weight': 700, fill: '#5b4129' }, clock, '');

    // controls
    const status = el('div', 'status', body);
    const grid = el('div', 'row', body);
    const sbtns = STEPS.map((s, i) => {
      const b = el('button', 'btn', grid, `${i + 1}. ${s}`);
      b.addEventListener('click', () => doStep(i));
      return b;
    });

    function lcdShow(txt, sub, color) {
      lcdTxt.textContent = txt; lcdSub.textContent = sub || '';
      lcdTxt.setAttribute('fill', color || '#7dffa8');
    }
    function setLiquid(fillColor, h, alpha) {
      water.setAttribute('fill', fillColor);
      water.setAttribute('y', by + bh - h);
      water.setAttribute('height', h);
      if (alpha != null) water.setAttribute('opacity', alpha);
    }
    function flicker(target, ms, done, base) {
      const t0 = Date.now();
      const iv = every(() => {
        const k = (Date.now() - t0) / ms;
        if (k >= 1) { clearInterval(iv); lcdShow(target.toFixed(2), base, phColor(target) === '' ? '' : '#7dffa8'); done && done(); return; }
        const amp = (1 - k) * 1.6;
        lcdShow((target + (Math.random() * 2 - 1) * amp).toFixed(2), 'reading…');
      }, 70);
    }
    function render() {
      sbtns.forEach((b, i) => {
        const locked = i > step || busy;
        const done = i < step;
        b.disabled = locked || done;
        b.classList.toggle('primary', i === step && !busy);
        b.textContent = (done ? '✓ ' : '') + `${i + 1}. ${STEPS[i]}`;
      });
      status.textContent = busy ? '…' : MSG[step];
      Object.keys(sbtn).forEach(k => sbtn[k].classList.toggle('sel', k === sample));
    }
    function clearBeaker() {
      stopAll(); busy = false;
      setLiquid('#9fd0e8', 0, .75);
      soil.setAttribute('y', by + bh); soil.setAttribute('height', 0);
      cloud.setAttribute('opacity', 0);
      specks.forEach(s => s.setAttribute('opacity', 0));
      rod.style.display = 'none';
      clock.style.display = 'none';
      bot.style.display = 'none';
      beakerLbl.textContent = '';
      setProbe(probeY.up);
    }
    function pick(k) {
      if (busy) return;
      sample = k;
      if (step >= 4 || step === 3) {      // back to "add soil"
        const keep = step >= 3 ? 3 : step;
        clearBeaker(); step = keep;
        lcdShow('--.--', 'READY');
      }
      render();
    }
    function bufferStep(ph, next) {
      busy = true; render();
      bot.style.display = '';
      botFill.setAttribute('fill', phColor(ph)); botTxt.textContent = 'pH ' + ph;
      beakerLbl.textContent = 'pH ' + ph + ' buffer';
      setLiquid(phColor(ph), 70, .85);
      setProbe(probeY.down);
      lcdShow('--.--', 'CALIBRATING');
      flicker(ph, 1500, () => {
        lcdShow(ph.toFixed(2), 'CAL OK ✓');
        later(() => {
          setProbe(probeY.up); setLiquid('#9fd0e8', 0); beakerLbl.textContent = ''; bot.style.display = 'none';
          busy = false; step = next; render();
        }, 700);
      });
    }
    function doStep(i) {
      if (i !== step || busy) return;
      if (i === 0) {
        led.setAttribute('fill', '#5dff7c'); lcdShow('--.--', 'READY');
        step = 1; render();
      } else if (i === 1) bufferStep(7, 2);
      else if (i === 2) bufferStep(4, 3);
      else if (i === 3) {
        busy = true; render();
        beakerLbl.textContent = 'soil: ' + SAMPLES[sample][0].toLowerCase();
        let h = 0;
        const iv = every(() => {
          h += 3; soil.setAttribute('y', by + bh - h); soil.setAttribute('height', h);
          if (h >= 30) { clearInterval(iv); busy = false; step = 4; render(); }
        }, 40);
      } else if (i === 4) {
        busy = true; render();
        let h = 0;
        const iv = every(() => {
          h += 3; setLiquid('#9fd0e8', h, .7);
          if (h >= 90) {
            clearInterval(iv);
            rod.style.display = '';
            cloud.setAttribute('opacity', .55); specks.forEach(s => s.setAttribute('opacity', .9));
            const t0 = Date.now();
            const st = every(() => {
              const k = (Date.now() - t0) / 2200;
              rod.setAttribute('transform', `translate(${bx + bw / 2 + Math.sin(k * 20) * 30},${by - 40}) rotate(${Math.sin(k * 20) * 14})`);
              if (k >= 1) { clearInterval(st); rod.style.display = 'none'; busy = false; step = 5; render(); }
            }, 40);
          }
        }, 35);
      } else if (i === 5) {
        busy = true; render();
        clock.style.display = '';
        const t0 = Date.now(), dur = 2600;
        const iv = every(() => {
          const k = Math.min(1, (Date.now() - t0) / dur);
          hand.setAttribute('transform', `rotate(${k * 360 * 2})`);
          clockTxt.textContent = Math.round(k * 30) + ' min';
          cloud.setAttribute('opacity', .55 * (1 - k) + .04);
          specks.forEach((s, j) => { s.setAttribute('opacity', .9 * (1 - k)); s.setAttribute('cy', by + bh - 50 + (j * 23) % 44 + k * 30 - (j * 23 % 44) * k * .7); });
          if (k >= 1) {
            clearInterval(iv); clock.style.display = 'none'; busy = false; step = 6; render();
          }
        }, 50);
      } else if (i === 6) {
        busy = true; render();
        setProbe(probeY.down);
        const target = SAMPLES[sample][1];
        lcdShow('--.--', 'MEASURING');
        later(() => flicker(target, 2200, () => {
          lcdShow(target.toFixed(2), phLabel(target).toUpperCase());
          beakerLbl.textContent = SAMPLES[sample][0] + ': pH ' + target.toFixed(1) + ' (' + phLabel(target) + ')';
          busy = false; step = 7; render();
        }), 500);
      }
    }

    function reset() {
      clearBeaker();
      step = 0; reading = null;
      led.setAttribute('fill', '#5a2a2a');
      lcdShow('', '');
      render();
    }
    reset();
    return { reset, pause: () => {} };
  }
};
</script>
<script>
/* Slide 3 — Effects on Rice and Roses */
(window.SLIDES = window.SLIDES || [])[2] = {
  title: 'Effects on Rice and Roses',
  bullets: [
    '<b>Rice</b> (best pH 5.5–6.5) tolerates acidity',
    'Rice below pH 5: <b>Al / Fe toxicity</b>; alkaline: Fe / Zn deficiency, yellow leaves, fewer grains',
    '<b>Roses</b> (best pH 6.0–6.5): very acidic soil loses <b>Ca / Mg</b>',
    'Roses in alkaline soil: Fe / Mn lock-up → <b>interveinal chlorosis</b> (yellow leaves, green veins)'
  ],
  fact: ['6.0–6.5', 'the narrow window where roses thrive; rice tolerates 5.5–6.5'],
  build(body) {
    const readout = el('div', 'readout', body);
    const chip = el('span', 'chip', readout);
    el('span', 'note', readout, 'Drag the slider: same soil, two crops');
    const slider = makeSlider(body, 3.5, 9, 0.1, 6.0, upd);

    const W = 680, H = 350, GY = 232;
    const svg = sv('svg', { viewBox: `0 0 ${W} ${H}` }, body);
    sv('rect', { x: 0, y: 0, width: W, height: GY, rx: 10, fill: '#e6f1f6' }, svg);
    sv('rect', { x: 0, y: GY, width: W, height: 52, fill: '#6b4a2c' }, svg);
    const soilTint = sv('rect', { x: 0, y: GY, width: W, height: 52, fill: '#fff', opacity: .25 }, svg);
    sv('line', { x1: W / 2, x2: W / 2, y1: 12, y2: GY + 50, stroke: '#fff', 'stroke-width': 3, 'stroke-dasharray': '6 5', opacity: .8 }, svg);
    sv('text', { x: 170, y: GY + 32, 'text-anchor': 'middle', 'font-size': 17, 'font-weight': 700, fill: '#f6ecd9' }, svg, 'RICE · best 5.5–6.5');
    sv('text', { x: 510, y: GY + 32, 'text-anchor': 'middle', 'font-size': 17, 'font-weight': 700, fill: '#f6ecd9' }, svg, 'ROSE · best 6.0–6.5');
    const riceG = sv('g', {}, svg), roseG = sv('g', {}, svg);

    // health bars + labels
    function bar(cx) {
      const x = cx - 130;
      sv('rect', { x, y: GY + 62, width: 260, height: 16, rx: 8, fill: '#e1d6bf' }, svg);
      const fill = sv('rect', { x, y: GY + 62, width: 260, height: 16, rx: 8, fill: '#2fa655', class: 'bar-rect' }, svg);
      const hv = sv('text', { x: cx, y: GY + 75, 'text-anchor': 'middle', 'font-size': 12, 'font-weight': 700, fill: '#2f261c', stroke: '#fff', 'stroke-width': 3, 'paint-order': 'stroke' }, svg, '');
      const cause = sv('text', { x: cx, y: GY + 98, 'text-anchor': 'middle', 'font-size': 13, 'font-weight': 600, fill: '#3b2a1a' }, svg, '');
      const cause2 = sv('text', { x: cx, y: GY + 114, 'text-anchor': 'middle', 'font-size': 13, fill: '#6b5a48' }, svg, '');
      return { fill, hv, cause, cause2, x };
    }
    const rb = bar(170), sb = bar(510);
    const hcol = h => h > 75 ? '#2fa655' : h > 45 ? '#d6a21f' : '#d7261e';
    function setBar(b, h, c1, c2) {
      b.fill.setAttribute('width', 260 * h / 100);
      b.fill.setAttribute('fill', hcol(h));
      b.hv.textContent = 'health ' + Math.round(h) + '%';
      b.cause.textContent = c1; b.cause2.textContent = c2;
    }

    function riceHealth(p) {
      let h = 100;
      if (p < 5.5) h -= (5.5 - p) * 28 + Math.max(0, 5 - p) * 26;
      if (p > 6.5) h -= (p - 6.5) * 28;
      return clamp(h, 6, 100);
    }
    function roseHealth(p) {
      let h = 100;
      if (p < 6) h -= (6 - p) * 30;
      if (p > 6.5) h -= (p - 6.5) * 36;
      return clamp(h, 6, 100);
    }

    function drawRice(p, h) {
      riceG.innerHTML = '';
      const hf = h / 100, cx = 170;
      const leaf = p > 6.6 ? mix('#5aa02c', '#dccb3a', (p - 6.6) / 1.6)
                 : p < 5.5 ? mix('#5aa02c', '#b8791f', (5.5 - p) / 1.5) : '#5aa02c';
      const H = 60 + 120 * hf;
      const n = 5;
      const grains = Math.round(hf * hf * 12);
      let gi = 0;
      for (let i = 0; i < n; i++) {
        const dx = (i - 2) * 22, hh = H * (0.82 + 0.18 * ((i * 7) % 5) / 4);
        const x0 = cx + dx * .45, tipx = cx + dx * 1.3, tipy = GY - hh;
        sv('path', { d: `M${x0},${GY} Q${x0 + dx * .1},${GY - hh * .55} ${tipx},${tipy}`, stroke: leaf, 'stroke-width': 5, fill: 'none', 'stroke-linecap': 'round' }, riceG);
        // long drooping leaf
        const lx = x0 + (dx >= 0 ? 1 : -1) * (30 + 8 * hf);
        sv('path', { d: `M${x0},${GY - hh * .5} Q${x0 + (dx >= 0 ? 1 : -1) * 18},${GY - hh * .75} ${lx},${GY - hh * .55 + 18 * (1 - hf)}`, stroke: leaf, 'stroke-width': 4, fill: 'none', 'stroke-linecap': 'round' }, riceG);
        // grain head: drooping panicle
        const heads = i % 2 === 0 ? 3 : 2;
        for (let g = 0; g < heads && gi < grains; g++, gi++) {
          const a = g * 14 + (i % 2) * 6;
          sv('ellipse', { cx: tipx + 5 + a * .45, cy: tipy + 3 + g * 9, rx: 4, ry: 7, fill: '#e3c35a', stroke: '#b8962f', 'stroke-width': 1, transform: `rotate(${-20 + g * 10} ${tipx + 5 + a * .45} ${tipy + 3 + g * 9})` }, riceG);
        }
      }
      if (p < 5) {  // toxic root damage
        sv('path', { d: `M${cx - 30},${GY} q-6,26 -2,40 M${cx},${GY} q4,30 -2,42 M${cx + 30},${GY} q6,26 2,38`, stroke: '#a8532b', 'stroke-width': 3, fill: 'none', 'stroke-dasharray': '3 3' }, riceG);
      }
    }

    function drawRose(p, h) {
      roseG.innerHTML = '';
      const hf = h / 100, cx = 510;
      const H = 70 + 130 * hf;
      const chlor = clamp((p - 6.6) / 1.6, 0, 1), acid = clamp((6 - p) / 1.8, 0, 1);
      let fillC = mix('#3d8f3a', '#dcd35a', chlor);
      fillC = mix(fillC, '#9aa27c', acid * .8);
      const edge = acid > .3 ? '#8a6b3a' : '#2d6a2a';
      sv('path', { d: `M${cx},${GY} Q${cx + 6},${GY - H * .5} ${cx},${GY - H}`, stroke: '#3a7a35', 'stroke-width': 6, fill: 'none', 'stroke-linecap': 'round' }, roseG);
      const nL = 3;
      for (let i = 0; i < nL; i++) {
        const y = GY - H * (0.25 + i * .25);
        [-1, 1].forEach(sd => {
          const L = 60 * (0.7 + 0.3 * hf);
          const g = sv('g', { transform: `translate(${cx},${y}) rotate(${sd * -34}) scale(1)` }, roseG);
                    // leaf shape drawn along +x for sd=1; rotated by transform
          const rot = sd < 0 ? 'scale(-1,1)' : '';
          const inner = sv('g', { transform: rot }, g);
          sv('path', { d: `M0,0 Q${L * .5},-${L * .38} ${L},0 Q${L * .5},${L * .38} 0,0`, fill: fillC, stroke: edge, 'stroke-width': 1.6 }, inner);
          const veinC = chlor > .2 ? '#1f7a2a' : '#1f6428';
          sv('path', { d: `M0,0 L${L * .95},0`, stroke: veinC, 'stroke-width': chlor > .2 ? 2.4 : 1.4, fill: 'none' }, inner);
          if (chlor > .2) {
            [[.35, -.2], [.35, .2], [.62, -.15], [.62, .15]].forEach(([a, b]) =>
              sv('path', { d: `M${L * a * .7},0 L${L * (a + .22)},${L * b}`, stroke: veinC, 'stroke-width': 1.8, fill: 'none' }, inner));
          }
          if (acid > .4) {
            sv('circle', { cx: L * .6, cy: -L * .08, r: 2.5, fill: '#8a6b3a' }, inner);
            sv('circle', { cx: L * .35, cy: L * .1, r: 2, fill: '#8a6b3a' }, inner);
          }
        });
      }
      // flowers
      const nF = Math.round(hf * 3 - .2);
      const spots = [[cx, GY - H - 4], [cx - 36, GY - H * .72], [cx + 36, GY - H * .62]];
      spots.forEach((s, i) => {
        if (i < nF) {
          const r = 17 * (0.65 + .35 * hf);
          if (i > 0) sv('path', { d: `M${cx},${GY - H * (i === 1 ? .5 : .42)} Q${s[0]},${s[1] + 20} ${s[0]},${s[1]}`, stroke: '#3a7a35', 'stroke-width': 4, fill: 'none' }, roseG);
          sv('circle', { cx: s[0], cy: s[1], r, fill: '#c8223f' }, roseG);
          sv('circle', { cx: s[0], cy: s[1], r: r * .68, fill: '#e03a58' }, roseG);
          sv('circle', { cx: s[0], cy: s[1], r: r * .36, fill: '#b01733' }, roseG);
          sv('path', { d: `M${s[0] - r * .3},${s[1]} q${r * .3},-${r * .3} ${r * .6},0`, stroke: '#7d0f24', 'stroke-width': 1.5, fill: 'none' }, roseG);
        }
      });
      if (nF < 1) sv('ellipse', { cx, cy: GY - H - 8, rx: 6, ry: 9, fill: '#5a8f3a' }, roseG);
    }

    function riceCause(p) {
      if (p < 5) return ['Al³⁺ / Fe²⁺ toxicity', 'roots damaged, leaves bronzed'];
      if (p < 5.5) return ['Mild Al / Fe stress', 'rice still copes with acidity'];
      if (p <= 6.5) return ['Optimal pH', 'balanced nutrients, full grain heads'];
      if (p <= 7.4) return ['Fe / Zn getting scarce', 'leaves paling, fewer grains'];
      return ['Fe / Zn deficiency', 'yellow leaves, few grains'];
    }
    function roseCause(p) {
      if (p < 5.2) return ['Ca / Mg washed out', 'weak growth, pale spotted leaves'];
      if (p < 6) return ['Slightly acidic: some Ca / Mg loss', 'fewer blooms'];
      if (p <= 6.5) return ['Optimal pH', 'dark leaves, many blooms'];
      if (p <= 7.2) return ['Fe / Mn availability falling', 'new leaves start to yellow'];
      return ['Fe / Mn locked up', 'interveinal chlorosis: yellow, green veins'];
    }

    function upd(p) {
      p = parseFloat(p);
      chip.style.background = phColor(p);
      chip.textContent = 'pH ' + p.toFixed(1) + ' · ' + phLabel(p);
      soilTint.setAttribute('fill', phColor(p));
      const rh = riceHealth(p), sh = roseHealth(p);
      drawRice(p, rh); drawRose(p, sh);
      const rc = riceCause(p), sc = roseCause(p);
      setBar(rb, rh, rc[0], rc[1]);
      setBar(sb, sh, sc[0], sc[1]);
    }
    upd(6.0);
    return { reset() { slider.value = 6.0; upd(6.0); } };
  }
};

<script>
/* Slide 4 — Why Soil pH Varies */
(window.SLIDES = window.SLIDES || [])[3] = {
  title: 'Why Soil pH Varies',
  bullets: [
    '<b>Parent rock</b>: limestone → alkaline, granite → acidic',
    '<b>Rain</b> washes out calcium and magnesium, so pH slowly falls',
    '<b>Ammonium fertilizers</b> release H<sup>+</sup> as they convert to nitrate',
    '<b>Acid rain</b> (fossil-fuel SO<sub>2</sub> / NO<sub>x</sub>) acidifies soil faster'
  ],
  fact: ['Ca<sup>2+</sup> Mg<sup>2+</sup>', 'base cations washed out by rain leave the soil more acidic over time'],
  build(body) {
    const MIN = 4, MAX = 8.5, START = 6.5;
    let ph = START, rock = null, rain = 0, rainLeft = 0, glideTo = null, glideSpeed = 0, drops = [], ions = [], pellets = [], iv = null, pelletsLeft = 0;

    const W = 680, H = 400;
    const btns = el('div', 'row', body);
    const bLime = el('button', 'btn', btns, 'Limestone');
    const bGran = el('button', 'btn', btns, 'Granite');
    const bRain = el('button', 'btn', btns, 'Rain');
    const bAcid = el('button', 'btn', btns, 'Acid rain');
    const bFert = el('button', 'btn', btns, 'Fertilizer');
    const svg = sv('svg', { viewBox: `0 0 ${W} ${H}` }, body);

    const sky = sv('rect', { x: 0, y: 0, width: W, height: 216, rx: 10, fill: '#dbeaf3' }, svg);
    const gauge = makeGauge(svg, { x: 40, y: 50, w: 600, h: 22, min: 4, max: 8.5 });
    // cloud
    const cloud = sv('g', { transform: 'translate(285,96)' }, svg);
    const cloudCol = [];
    [[0, 18, 30], [34, 6, 36], [74, 16, 32], [48, 24, 34]].forEach(c =>
      cloudCol.push(sv('circle', { cx: c[0] + 20, cy: c[1] + 18, r: c[2] * .72, fill: '#fff' }, cloud)));
    sv('rect', { x: 14, y: 30, width: 96, height: 22, rx: 11, fill: '#fff' }, cloud);
    cloudCol.push(cloud.lastChild);

    // ground layers
    const GY = 216;
    const top = sv('rect', { x: 0, y: GY, width: W, height: 54, fill: '#6b4a2c' }, svg);
    const topTint = sv('rect', { x: 0, y: GY, width: W, height: 54, fill: '#fff', opacity: .3 }, svg);
    sv('rect', { x: 0, y: GY + 54, width: W, height: 54, fill: '#8a6a45' }, svg);
    sv('line', { x1: 0, x2: W, y1: GY + 54, y2: GY + 54, stroke: '#4a3118', 'stroke-width': 1, 'stroke-dasharray': '5 4' }, svg);
    const rockG = sv('g', {}, svg);
    const rockBase = sv('rect', { x: 0, y: GY + 108, width: W, height: 90, fill: '#8d8d8d' }, rockG);
    const rockDeco = sv('g', {}, rockG);
    sv('text', { x: 14, y: GY + 18, 'font-size': 13, 'font-weight': 700, fill: '#f6ecd9' }, svg, 'TOPSOIL');
    sv('text', { x: 14, y: GY + 74, 'font-size': 13, 'font-weight': 700, fill: '#f6ecd9' }, svg, 'SUBSOIL');
    const rockLbl = sv('text', { x: 14, y: GY + 132, 'font-size': 14, 'font-weight': 700, fill: '#2f261c' }, svg, 'PARENT ROCK: choose one');
    // grass
    for (let x = 4; x < W; x += 9) sv('path', { d: `M${x},${GY} l2,-9 l2,9`, fill: '#4f8f3a' }, svg);
    const msg = sv('text', { x: W / 2, y: 200, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': 700, fill: '#2f261c' }, svg, '');

    const fxG = sv('g', {}, svg);

    function drawRock(kind) {
      rockDeco.innerHTML = '';
      if (kind === 'lime') {
        rockBase.setAttribute('fill', '#e8dfc8');
        for (let r = 0; r < 2; r++) for (let c = 0; c < 9; c++)
          sv('rect', { x: c * 80 + (r % 2 ? 40 : 0) - 30, y: GY + 140 + r * 28, width: 76, height: 28, rx: 4, fill: 'none', stroke: '#c9bc9b', 'stroke-width': 1.5 }, rockDeco);
        for (let i = 0; i < 12; i++) sv('ellipse', { cx: 70 + i * 52, cy: GY + 148 + (i * 13) % 40, rx: 6, ry: 3, fill: '#bfae86' }, rockDeco);
        rockLbl.textContent = 'LIMESTONE (alkaline, CaCO₃)';
      } else if (kind === 'gran') {
        rockBase.setAttribute('fill', '#9a8f93');
        for (let i = 0; i < 60; i++) sv('circle', { cx: (i * 53) % W, cy: GY + 140 + (i * 29) % 44, r: 2 + (i % 3), fill: ['#e0b5a8', '#3d3a3c', '#f2efe9'][i % 3] }, rockDeco);
        rockLbl.textContent = 'GRANITE (acidic, silica-rich)';
      } else { rockBase.setAttribute('fill', '#8d8d8d'); rockLbl.textContent = 'PARENT ROCK: choose one'; }
    }

    function note(t) { msg.textContent = t; }
    function setPh(v) {
      ph = clamp(v, MIN, MAX);
      gauge.set(ph);
      topTint.setAttribute('fill', phColor(ph));
    }
    function glide(to, speed) { glideTo = clamp(to, MIN, MAX); glideSpeed = speed; }

    function render() {
      bRain.classList.toggle('sel', rain === 1);
      bAcid.classList.toggle('sel', rain === 2);
      bLime.classList.toggle('sel', rock === 'lime');
      bGran.classList.toggle('sel', rock === 'gran');
      cloudCol.forEach(c => c.setAttribute('fill', rain === 2 ? '#c9b56a' : rain === 1 ? '#aab7c2' : '#fff'));
    }
    function startRain(kind) {
      if (rain === kind) { rain = 0; note(''); render(); return; }
      rain = kind; rainLeft = 10;
      note(kind === 2 ? 'Acid rain (SO₂ / NOₓ): H⁺ added fast, Ca / Mg leach out' : 'Rain washes Ca²⁺ and Mg²⁺ down and out: pH slowly falls');
      render();
    }
    bRain.addEventListener('click', () => startRain(1));
    bAcid.addEventListener('click', () => startRain(2));
    bLime.addEventListener('click', () => { rock = 'lime'; drawRock('lime'); glide(7.9, 1.0); note('Limestone weathers: CaCO₃ neutralises acid → pH rises'); render(); });
    bGran.addEventListener('click', () => { rock = 'gran'; drawRock('gran'); glide(5.0, 1.0); note('Granite weathers: few bases, soil stays acidic → pH falls'); render(); });
    bFert.addEventListener('click', () => {
      pelletsLeft = 14; glide(ph - 0.4, 0.3);
      note('Ammonium (NH₄⁺) → nitrate releases H⁺: pH drops');
    });

    function tick() {
      const dt = 0.05;
      // rain fall
      if (rain) {
        const n = rain === 2 ? 2 : 1;
        for (let i = 0; i < n; i++) if (Math.random() < .8)
          drops.push({ x: 300 + Math.random() * 120, y: 150, vy: 140 + Math.random() * 60, el: sv('ellipse', { rx: 2.2, ry: 4.5, fill: rain === 2 ? '#d4b72a' : '#4f8fd0', cx: 0, cy: 0 }, fxG), vx: (Math.random() - .5) * 20 });
        setPh(ph - (rain === 2 ? 0.45 : 0.1) * dt);
        // Ca/Mg ions leaching
        if (Math.random() < (rain === 2 ? .5 : .25) && ions.length < 14) {
          const x = 40 + Math.random() * 600, c = Math.random() < .5;
          ions.push({ x, y: GY + 8, vy: 22 + Math.random() * 20, life: 1, el: sv('text', { 'font-size': 11, 'font-weight': 700, fill: c ? '#e9f6ff' : '#d7f5e8', 'text-anchor': 'middle' }, fxG, c ? 'Ca²⁺' : 'Mg²⁺') });
        }
        rainLeft -= dt;
        if (rainLeft <= 0) { rain = 0; note('Rain stopped'); render(); }
        if (ph <= MIN + 0.001) { rain = 0; note('pH has reached the lower limit (4.0)'); render(); }
      }
      // fertilizer pellets
      if (pelletsLeft > 0 && Math.random() < .6) {
        pelletsLeft--; pellets.push({ x: 40 + Math.random() * 600, y: 140, vy: 120, el: sv('circle', { r: 3.2, fill: '#f4f0e6', stroke: '#9a8f7c' }, fxG) });
      }
      if (glideTo != null) {
        const d = glideTo - ph, s = glideSpeed * dt;
        if (Math.abs(d) <= s) { setPh(glideTo); glideTo = null; } else setPh(ph + Math.sign(d) * s);
      }
      drops = drops.filter(d => {
        d.y += d.vy * dt; d.x += d.vx * dt;
        d.el.setAttribute('cx', d.x); d.el.setAttribute('cy', d.y);
        if (d.y > GY - 2) { d.el.remove(); return false; } return true;
      });
      ions = ions.filter(d => {
        d.y += d.vy * dt; d.life -= dt * .22;
        d.el.setAttribute('x', d.x); d.el.setAttribute('y', d.y); d.el.setAttribute('opacity', Math.max(d.life, 0));
        if (d.life <= 0 || d.y > GY + 100) { d.el.remove(); return false; } return true;
      });
      pellets = pellets.filter(d => {
        d.y += d.vy * dt;
        d.el.setAttribute('cx', d.x); d.el.setAttribute('cy', d.y);
        if (d.y > GY + 2) { d.el.remove(); return false; } return true;
      });
    }

    function clearFx() { fxG.innerHTML = ''; drops = []; ions = []; pellets = []; pelletsLeft = 0; }
    function start() { if (!iv) iv = setInterval(tick, 50); }
    function stop() { if (iv) { clearInterval(iv); iv = null; } }

    function reset() {
      rain = 0; rock = null; glideTo = null; clearFx(); drawRock(null);
      setPh(START); note('Pick a rock or a weather event'); render();
      start();
    }
    reset();
    return { reset, pause: stop, resume: start };
  }
};
</script>
<script>
/* Slide 5 — Changing Soil pH */
(window.SLIDES = window.SLIDES || [])[4] = {
  title: 'Changing Soil pH',
  bullets: [
    '<b>Lime</b> (calcium carbonate) raises pH',
    '<b>Sulfur</b> lowers pH slowly: bacteria need weeks to months',
    '<b>Test the soil first</b>, then amend',
    '<b>Blueberries</b> need pH 4.5–5.5',
    '<b>Hydrangeas</b>: blue in acidic soil, pink in alkaline'
  ],
  fact: ['4.5–5.5', 'target pH for blueberries: test the soil first, then amend'],
  build(body) {
    const MIN = 3.5, MAX = 9, START = 6.5;
    let ph = START, glideTo = null, speed = 0, waiting = false, timers = [], iv = null;
    const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.push(t); };

    const btns = el('div', 'row', body);
    const bLime = el('button', 'btn primary', btns, 'Add lime  ↑');
    const bSul = el('button', 'btn primary', btns, 'Add sulfur  ↓');
    const info = el('span', 'note', btns, '');
    const W = 680, H = 400;
    const svg = sv('svg', { viewBox: `0 0 ${W} ${H}` }, body);
    const gauge = makeGauge(svg, { x: 40, y: 52, w: 600, h: 24, min: MIN, max: MAX, zone: [4.5, 5.5, 'blueberry zone 4.5–5.5'] });
    const status = sv('text', { x: 40, y: 150, 'font-size': 14, 'font-weight': 700, fill: '#2f261c' }, svg, '');
    const sub = sv('text', { x: 40, y: 170, 'font-size': 13, fill: '#6b5a48' }, svg, '');

    // hydrangea in pot
    const plant = sv('g', { transform: 'translate(340,0)' }, svg);
    sv('path', { d: 'M-50,300 L-40,380 Q0,392 40,380 L50,300 Z', fill: '#b5643a', stroke: '#7d4524', 'stroke-width': 2 }, plant);
    const potSoil = sv('ellipse', { cx: 0, cy: 300, rx: 50, ry: 9, fill: '#5b4129' }, plant);
    sv('rect', { x: -56, y: 292, width: 112, height: 12, rx: 5, fill: '#c9764a', stroke: '#7d4524', 'stroke-width': 2 }, plant);
    sv('path', { d: 'M0,296 C -4,270 4,240 0,210', stroke: '#3a7a35', 'stroke-width': 7, fill: 'none', 'stroke-linecap': 'round' }, plant);
    [[-1, 270], [1, 262], [-1, 238], [1, 232]].forEach(([s, y]) => {
      const g = sv('g', { transform: `translate(0,${y}) scale(${s},1) rotate(-25)` }, plant);
      sv('path', { d: 'M0,0 Q36,-24 70,0 Q36,22 0,0', fill: '#4a8f3a', stroke: '#2d6a2a', 'stroke-width': 1.5 }, g);
      sv('path', { d: 'M0,0 L64,0', stroke: '#2d6a2a', 'stroke-width': 1.4, fill: 'none' }, g);
    });
    // flower head: florets
    const florets = [];
    const centers = [[0, 168, 62], [-40, 190, 44], [40, 190, 44]];
    centers.forEach(([cx, cy, R]) => {
      for (let i = 0; i < 26; i++) {
        const a = i * 2.399, r = Math.sqrt(i / 26) * R, x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r * .8;
        const f = sv('g', { transform: `translate(${x},${y})` }, plant);
        const petals = [];
        for (let k = 0; k < 4; k++) petals.push(sv('ellipse', { cx: Math.cos(k * 1.5708 + 0.4) * 7, cy: Math.sin(k * 1.5708 + 0.4) * 7, rx: 8, ry: 6.5, fill: '#888', stroke: 'rgba(0,0,0,.15)', 'stroke-width': .8 }, f));
        florets.push(petals);
      }
    });
    const hydLbl = sv('text', { x: 0, y: 410, 'text-anchor': 'middle', 'font-size': 14, 'font-weight': 700, fill: '#2f261c' }, plant, '');
    plant.setAttribute('transform', 'translate(500,18) scale(.92)');

    // colour legend left side
    const lg = sv('g', { transform: 'translate(40,216)' }, svg);
    sv('text', { x: 0, y: 0, 'font-size': 13, 'font-weight': 700, fill: '#5b4129' }, lg, 'HYDRANGEA COLOUR');
    [['#3b64e0', 'pH < 5.5  blue'], ['#8a5cc8', 'pH ≈ 6–6.5  purple'], ['#ec6fae', 'pH > 7  pink']].forEach(([c, t], i) => {
      sv('circle', { cx: 8, cy: 22 + i * 26, r: 8, fill: c }, lg);
      sv('text', { x: 24, y: 27 + i * 26, 'font-size': 13, fill: '#3b2a1a' }, lg, t);
    });
    const berry = sv('g', { transform: 'translate(40,334)' }, svg);
    sv('text', { x: 0, y: 0, 'font-size': 13, 'font-weight': 700, fill: '#5b4129' }, berry, 'BLUEBERRY');
    const berryTxt = sv('text', { x: 0, y: 22, 'font-size': 14, 'font-weight': 700 }, berry, '');
    const berryTxt2 = sv('text', { x: 0, y: 42, 'font-size': 12, fill: '#6b5a48' }, berry, '');

    function hydColor(p) {
      if (p <= 5.0) return '#3b64e0';
      if (p <= 6.3) return mix('#3b64e0', '#8a5cc8', (p - 5.0) / 1.3);
      if (p <= 7.5) return mix('#8a5cc8', '#ec6fae', (p - 6.3) / 1.2);
      return '#ec6fae';
    }
    function setPh(v) {
      ph = clamp(v, MIN, MAX);
      gauge.set(ph);
      const c = hydColor(ph);
      florets.forEach((pt, i) => pt.forEach((e, k) => e.setAttribute('fill', mix(c, (i + k) % 3 === 0 ? '#ffffff' : '#000000', (i + k) % 3 === 0 ? .18 : .1))));
      potSoil.setAttribute('fill', mix('#5b4129', phColor(ph), .25));
      const col = ph < 5.2 ? 'blue' : ph < 6.0 ? 'blue-purple' : ph < 6.8 ? 'purple' : ph < 7.4 ? 'pink-purple' : 'pink';
      hydLbl.textContent = 'Hydrangea: ' + col;
      const inZone = ph >= 4.5 && ph <= 5.5;
      berryTxt.textContent = inZone ? '✔ in target zone' : ph > 5.5 ? '✘ pH too high' : '✘ pH too low';
      berryTxt.setAttribute('fill', inZone ? '#2a7a3a' : '#b3261e');
      berryTxt2.textContent = inZone ? 'berries thrive' : ph > 5.5 ? 'add sulfur (slowly)' : 'add lime';
    }
    function glide(to, sp) { glideTo = clamp(to, MIN, MAX); speed = sp; }
    function say(a, b) { status.textContent = a; sub.textContent = b || ''; }

    bLime.addEventListener('click', () => {
      glide((glideTo != null ? glideTo : ph) + 0.6, 1.0);
      say('Lime added: calcium carbonate neutralises acidity', 'Works within days; avoid over-liming');
    });
    bSul.addEventListener('click', () => {
      if (waiting) return;
      waiting = true; bSul.disabled = true;
      say('Sulfur added…', 'Soil bacteria must convert it to sulfuric acid');
      let w = 0;
      const t = setInterval(() => {
        w++;
        say('Weeks later…  (week ' + w * 2 + ')', 'Bacteria slowly oxidise sulfur → H⁺');
        if (w >= 4) {
          clearInterval(t);
          glide(ph - 0.6, 0.12);
          later(() => { waiting = false; bSul.disabled = false; say('Sulfur has worked: pH lowered', 'Retest the soil before adding more'); }, 5200);
        }
      }, 700);
      timers.push(t);
    });

    function tick() {
      if (glideTo == null) return;
      const d = glideTo - ph, s = speed * 0.05;
      if (Math.abs(d) <= s) { setPh(glideTo); glideTo = null; } else setPh(ph + Math.sign(d) * s);
    }
    function start() { if (!iv) iv = setInterval(tick, 50); }
    function stop() { if (iv) { clearInterval(iv); iv = null; } }

    function reset() {
      timers.forEach(t => { clearTimeout(t); clearInterval(t); }); timers = [];
      waiting = false; bSul.disabled = false; glideTo = null;
      setPh(START); say('Soil is slightly acidic', 'Add lime or sulfur and watch the pH and the flowers');
      start();
    }
    reset();
    return { reset, pause: stop, resume: start };
  }
};
</script>
<script>
/* Framework: helpers, slide registry, navigation, scaling.
   Slide files push into window.SLIDES[n-1] = { title, bullets:[html], build(body) -> {reset()} } */
window.SLIDES = window.SLIDES || [];

const SVGNS = 'http://www.w3.org/2000/svg';
function el(tag, cls, parent, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  if (parent) parent.appendChild(e);
  return e;
}
function sv(tag, attrs, parent, text) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in (attrs || {})) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function hex2rgb(h) { return [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16)); }
function mix(a, b, t) {
  t = clamp(t, 0, 1);
  const A = hex2rgb(a), B = hex2rgb(b);
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
// pH colour scale: red (acid) -> green (neutral) -> purple (alkaline)
const PH_STOPS = [[0,'#b3121b'],[3,'#d7261e'],[4.5,'#ef6a1a'],[5.7,'#e3c52a'],[6.5,'#7cbf3f'],
                  [7,'#2fa655'],[8,'#2d86c9'],[9,'#7a3fb5'],[14,'#5b2a8c']];
function phColor(p) {
  if (p <= PH_STOPS[0][0]) return PH_STOPS[0][1];
  for (let i = 1; i < PH_STOPS.length; i++) {
    if (p <= PH_STOPS[i][0]) {
      const [p0, c0] = PH_STOPS[i - 1], [p1, c1] = PH_STOPS[i];
      return mix(c0, c1, (p - p0) / (p1 - p0));
    }
  }
  return PH_STOPS[PH_STOPS.length - 1][1];
}
function phLabel(p) { return p < 6.8 ? 'acidic' : p <= 7.2 ? 'neutral' : 'alkaline'; }

let _uid = 0;
// pH slider with a pH-coloured track
function makeSlider(parent, min, max, step, val, onInput) {
  const wrap = el('div', 'slider-wrap', parent);
  const s = el('input', '', wrap);
  s.type = 'range'; s.min = min; s.max = max; s.step = step; s.value = val;
  const stops = [];
  for (let i = 0; i <= 10; i++) { const p = min + (max - min) * i / 10; stops.push(phColor(p) + ' ' + (i * 10) + '%'); }
  s.style.background = 'linear-gradient(90deg,' + stops.join(',') + ')';
  s.addEventListener('input', () => onInput(parseFloat(s.value)));
  const ticks = el('div', 'slider-ticks', wrap);
  for (let v = Math.ceil(min); v <= max; v++) el('span', '', ticks, v);
  return s;
}

// horizontal pH gauge drawn in SVG. o = {x,y,w,h,min,max,zone:[lo,hi,label]}
function makeGauge(parent, o) {
  const id = 'gg' + (++_uid);
  const g = sv('g', { transform: `translate(${o.x},${o.y})` }, parent);
  const defs = sv('defs', {}, g);
  const lg = sv('linearGradient', { id, x1: 0, x2: 1, y1: 0, y2: 0 }, defs);
  for (let i = 0; i <= 12; i++) {
    const p = o.min + (o.max - o.min) * i / 12;
    sv('stop', { offset: (i / 12 * 100) + '%', 'stop-color': phColor(p) }, lg);
  }
  const X = p => (clamp(p, o.min, o.max) - o.min) / (o.max - o.min) * o.w;
  sv('rect', { x: 0, y: 0, width: o.w, height: o.h, rx: o.h / 2, fill: `url(#${id})`, stroke: '#5b4129', 'stroke-width': 2 }, g);
  for (let v = Math.ceil(o.min); v <= o.max; v++) {
    sv('line', { x1: X(v), x2: X(v), y1: o.h, y2: o.h + 6, stroke: '#5b4129', 'stroke-width': 1.5 }, g);
    sv('text', { x: X(v), y: o.h + 20, 'text-anchor': 'middle', 'font-size': 13, fill: '#5b4129' }, g, v);
  }
  if (o.zone) {
    const [lo, hi, label] = o.zone;
    sv('rect', { x: X(lo), y: -6, width: X(hi) - X(lo), height: o.h + 12, rx: 6, fill: 'none',
      stroke: '#1d3f8f', 'stroke-width': 3, 'stroke-dasharray': '6 3' }, g);
    sv('text', { x: (X(lo) + X(hi)) / 2, y: o.h + 40, 'text-anchor': 'middle', 'font-size': 13, 'font-weight': 700, fill: '#1d3f8f' }, g, label);
  }
  const mark = sv('g', { class: 'gauge-mark', style: `transform:translateX(0px)` }, g);
  sv('polygon', { points: `-9,-20 9,-20 0,-3`, fill: '#2f261c' }, mark);
  sv('line', { x1: 0, x2: 0, y1: -3, y2: o.h + 3, stroke: '#2f261c', 'stroke-width': 3 }, mark);
  const val = sv('text', { x: 0, y: -26, 'text-anchor': 'middle', 'font-size': 19, 'font-weight': 700, fill: '#2f261c' }, mark, '');
  return {
    g,
    set(p) {
      mark.style.transform = `translateX(${X(p)}px)`;
      val.textContent = 'pH ' + p.toFixed(1);
    }
  };
}

(function () {
  const stage = document.getElementById('stage');
  const host = document.getElementById('slides');
  const counter = document.getElementById('counter');
  const TOTAL = 5;
  const views = [];
  let cur = 0;

  function fit() {
    const s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    stage.style.transform = `translate(-50%,-50%) scale(${s})`;
  }

  function buildSlide(i) {
    const def = window.SLIDES[i] || { title: 'Slide ' + (i + 1), bullets: ['(missing)'], build() { return { reset() {} }; } };
    const s = el('section', 'slide', host);
    el('div', 'kicker', s, `Soil science<i>/</i>0${i + 1}`);
    el('h1', '', s, def.title);
    if (def.byline) el('div', 'byline', s, def.byline);
    const cols = el('div', 'cols', s);
    const left = el('div', 'left', cols);
    const ul = el('ul', '', left);
    def.bullets.slice(0, 5).forEach(b => el('li', '', ul, b));
    if (def.fact) { const f = el('div', 'fact', left); el('div', 'big', f, def.fact[0]); el('div', 'cap', f, def.fact[1]); }
    const panel = el('div', 'panel', cols);
    const head = el('div', 'panel-head', panel, '<span>Experiment</span>');
    const rb = el('button', 'btn reset', head, 'Reset');
    const body = el('div', 'panel-body', panel);
    let api = null;
    const v = {
      el: s,
      ensure() { if (!api) api = def.build(body) || { reset() {} }; },
      reset() { if (api) api.reset(); },
      hide() { if (api && api.pause) api.pause(); },
      resume() { if (api && api.resume) api.resume(); }
    };
    rb.addEventListener('click', () => { v.ensure(); v.reset(); rb.blur(); });
    return v;
  }

  for (let i = 0; i < TOTAL; i++) views.push(buildSlide(i));

  function show(i) {
    i = clamp(i, 0, TOTAL - 1);
    if (views[cur]) { views[cur].hide(); views[cur].el.classList.remove('on'); }
    cur = i;
    views[i].ensure(); views[i].resume();
    views[i].el.classList.add('on');
    counter.textContent = (i + 1) + ' / ' + TOTAL;
    document.querySelector('#progress i').style.width = ((i + 1) / TOTAL * 100) + '%';
    try { history.replaceState(null, '', '#' + (i + 1)); } catch (e) {}
  }

  function toggleFS() {
    try {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    } catch (e) {}
  }

  document.getElementById('prev').addEventListener('click', e => { show(cur - 1); e.target.blur(); });
  document.getElementById('next').addEventListener('click', e => { show(cur + 1); e.target.blur(); });
  document.getElementById('fs').addEventListener('click', e => { toggleFS(); e.target.blur(); });
  window.addEventListener('resize', fit);

  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const onBtn = e.target && e.target.tagName === 'BUTTON';
    const k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown') { e.preventDefault(); show(cur + 1); }
    else if (k === 'ArrowLeft' || k === 'PageUp') { e.preventDefault(); show(cur - 1); }
    else if (k === ' ' && !onBtn) { e.preventDefault(); show(cur + 1); }
    else if (k === 'Home') { show(0); }
    else if (k === 'End') { show(TOTAL - 1); }
    else if (k === 'f' || k === 'F') { toggleFS(); }
  });

  fit();
  const h = parseInt((location.hash || '').slice(1), 10);
  show(h >= 1 && h <= TOTAL ? h - 1 : 0);
})();
</script>
